# ---------------------------------------------------------------------------
# my-cow-client CI/CD
#   every push / pull request -> unit tests (Vitest) + production build
#   push a tag like v9        -> the above, then build + push charmzzy/cow-client:v9 to Docker Hub
# Repo secrets needed: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
# ---------------------------------------------------------------------------
name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same Node major as the Dockerfile's build stage (node:22-alpine); caches ~/.npm by package-lock
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      # A broken import or template fails here, before an image is ever built
      - run: npm run build

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # API address is NOT baked in (relative /api via nginx), so one image serves every environment
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            charmzzy/cow-client:${{ github.ref_name }}
            charmzzy/cow-client:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
