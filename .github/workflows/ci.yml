# ---------------------------------------------------------------------------
# my-cow-client CI/CD
#   every push / pull request -> unit tests (Vitest) + production build
#   push a tag like v9        -> the above, then build + push charmzzy/cow-client:v9 (amd64 + arm64),
#                                then deploy it to the VPS (when DEPLOY_ENABLED=true)
# Repo secrets needed: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, VPS_HOST, VPS_USER, VPS_SSH_KEY
# ---------------------------------------------------------------------------
name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same Node major as the Dockerfile's build stage (node:22-alpine); caches ~/.npm by package-lock
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      # A broken import or template fails here, before an image is ever built
      - run: npm run build

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3      # arm64 build for the Oracle ARM server
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # API address is NOT baked in (relative /api via nginx), so one image serves every environment
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            charmzzy/cow-client:${{ github.ref_name }}
            charmzzy/cow-client:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # On with the repo variable DEPLOY_ENABLED=true; deploy.sh health-checks and rolls back on failure
    if: startsWith(github.ref, 'refs/tags/v') && vars.DEPLOY_ENABLED == 'true'
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: /srv/mycow/deploy.sh client ${{ github.ref_name }}
